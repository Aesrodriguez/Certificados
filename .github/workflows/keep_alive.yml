name: Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"  # cada 10 minutos
  workflow_dispatch: {}     # permite lanzarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping clara-certificados
        run: |
          echo "Pinging $(date)"
          curl -sf --max-time 60 https://clara-certificados.onrender.com/healthz \
            && echo "OK" || echo "Servicio despertando (primer ping esperado)"
