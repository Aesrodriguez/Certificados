services:
  - type: web
    name: clara-certificados
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
    healthCheckPath: /healthz
